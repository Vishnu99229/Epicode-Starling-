# Starling Phase 0 — local infra only (Postgres + Redis). No NATS.
services:
  postgres:
    image: postgres:16
    container_name: starling-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: starling
      POSTGRES_PASSWORD: starling
      POSTGRES_DB: starling
    volumes:
      - starling_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starling -d starling"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7
    container_name: starling-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  starling_pgdata:
    name: starling_pgdata
